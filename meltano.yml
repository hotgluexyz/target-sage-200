version: 1
send_anonymous_usage_stats: true
project_id: "target-sage-200"
default_environment: test
environments:
- name: test
plugins:
  extractors: []
  loaders:
  - name: "target-sage-200"
    namespace: "target_sage_200"
    pip_url: -e .
    capabilities:
    - about
    - stream-maps
    - record-flattening
    settings:
    - name: client_id
    - name: client_secret
      kind: password
    - name: refresh_token
      kind: password
    - name: access_token
      kind: password
    - name: site_id
    - name: company_id
      kind: integer
    - name: base_url
    - name: default_nominal_code
